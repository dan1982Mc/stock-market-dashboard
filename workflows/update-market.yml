name: Update Global Market Dashboard

on:
  workflow_dispatch:

  schedule:
    # Every Friday at 18:00 UTC
    - cron: "0 18 * * 5"

permissions:
  contents: write

jobs:
  update-market:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r updater/requirements.txt

      - name: Run market updater
        working-directory: updater
        run: |
          python update_market.py

      - name: Commit updated market data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/latest.json

          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update market data"
            git push
          fi
