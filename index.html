<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Global Market Dashboard</title>

    <link rel="stylesheet" href="css/dashboard.css">
</head>

<body>

<div class="container">

    <!-- =========================================================
         HEADER
    ========================================================== -->

    <header class="dashboard-header">

        <div>
            <h1>🌍 Global Market Dashboard</h1>

            <p class="subtitle">
                Global equities · valuation · risk · macro
            </p>
        </div>

        <div class="update-info">
            <div id="updatedAt">Loading...</div>
            <div id="dataThrough"></div>
        </div>

    </header>


    <!-- =========================================================
         GLOBAL REGIME
    ========================================================== -->

    <section class="regime-panel">

        <div class="regime-left">

            <div class="eyebrow">
                GLOBAL MARKET REGIME
            </div>

            <div id="regimeLabel"
                 class="regime-label">
                —
            </div>

            <div id="score"
                 class="regime-score">
                Score —
            </div>

        </div>


        <div class="regime-right">

            <div class="eyebrow">
                RECOMMENDED ACTION
            </div>

            <div id="recommendedAction"
                 class="recommended-action">
                —
            </div>

            <div id="regimeReason"
                 class="regime-reason">
            </div>

        </div>

    </section>


    <!-- =========================================================
         CORE INDICATORS
    ========================================================== -->

    <section>

        <div class="section-title">
            Market condition
        </div>

        <div id="indicatorGrid"
             class="indicator-grid">
        </div>

    </section>


    <!-- =========================================================
         MARKET SNAPSHOT
    ========================================================== -->

    <section>

        <div class="section-title">
            📊 Market snapshot
        </div>

        <div id="marketSnapshot"
             class="snapshot-grid">
        </div>

    </section>


    <!-- =========================================================
         INVESTOR ACTION
    ========================================================== -->

    <section>

        <div class="section-title">
            🎯 Investor action
        </div>

        <div class="action-panel">

            <div id="actionHeadline"
                 class="action-headline">
            </div>

            <p id="actionExplanation"></p>

            <button id="whyScoreButton"
                    class="secondary-button">
                Why this score?
            </button>

        </div>

    </section>


    <!-- =========================================================
         EXPANDABLE DETAILS
    ========================================================== -->

    <section>

        <div class="section-title">
            Details
        </div>

        <div class="details-container">


            <!-- VALUATION -->

            <details>

                <summary>
                    💰 Valuation details
                </summary>

                <div id="valuationDetails"
                     class="details-content">
                </div>

            </details>


            <!-- RISK -->

            <details>

                <summary>
                    😨 Risk & stress details
                </summary>

                <div id="riskDetails"
                     class="details-content">
                </div>

            </details>


            <!-- CHARTS -->

            <details>

                <summary>
                    📈 Market trend & charts
                </summary>

                <div id="chartDetails"
                     class="details-content">

                    <canvas id="trendChart"></canvas>

                </div>

            </details>


            <!-- WEEKLY -->

            <details>

                <summary>
                    📰 Weekly analysis
                </summary>

                <div id="weeklyDetails"
                     class="details-content">
                </div>

            </details>


        </div>

    </section>


    <!-- =========================================================
         FOOTER
    ========================================================== -->

    <footer id="sources"
            class="footer">
    </footer>

</div>


<!-- =============================================================
     MODAL
============================================================== -->

<div id="indicatorModal"
     class="modal">

    <div class="modal-content">

        <button id="closeModal"
                class="modal-close">
            ×
        </button>

        <div id="modalBody"></div>

    </div>

</div>


<script src="js/modal.js"></script>
<script src="js/charts.js"></script>
<script src="js/indicators.js"></script>
<script src="js/app.js"></script>

</body>
</html>
