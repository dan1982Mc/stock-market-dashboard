name: Update Global Market Dashboard

on:
  workflow_dispatch:

  schedule:
    # Every weekday at 17:30 UTC
    # This is after the main European/US market session.
    - cron: "30 17 * * 1-5"

permissions:
  contents: write

jobs:

  update-market:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r updater/requirements.txt

      - name: Update market data
        working-directory: updater
        run: |
          python update_market.py

      - name: Commit updated market data
        run: |

          git config user.name "market-dashboard-bot"

          git config user.email \
            "market-dashboard-bot@users.noreply.github.com"

          git add data/latest.json

          if git diff --cached --quiet; then
            echo "No market data changes."
          else
            git commit \
              -m "Update market data $(date -u '+%Y-%m-%d %H:%M UTC')"

            git push
          fi
