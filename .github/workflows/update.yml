name: Update Market Dashboard

on:
  workflow_dispatch:
  schedule:
    - cron: "30 6 * * 1-5"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r updater/requirements.txt

      - name: Update market data
        working-directory: updater
        run: python update_market_v2.py

      - name: Commit updated data
        run: |
          git config user.name "market-dashboard-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/latest.json data/history.json
          git diff --cached --quiet || git commit -m "Update V2 market data"
          git push
