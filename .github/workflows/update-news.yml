name: Update Market News

on:
  workflow_dispatch:
  schedule:
    - cron: "0 7 * * 1-5"
    - cron: "0 11 * * 1-5"
    - cron: "0 15 * * 1-5"
    - cron: "0 19 * * 1-5"

permissions:
  contents: write

jobs:
  update-news:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r updater/requirements.txt

      - name: Fetch market news
        run: python updater/fetch_news.py

      - name: Commit updated news
        run: |
          git config user.name "market-dashboard-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/news.json
          git diff --cached --quiet || git commit -m "Update market news"
          git push
