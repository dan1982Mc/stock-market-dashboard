name: Friday Global Market Email

on:

  workflow_dispatch:

  schedule:

    # Friday 16:00 UTC
    - cron: "0 16 * * 5"


jobs:

  weekly-report:

    runs-on: ubuntu-latest


    steps:

      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Setup Python
        uses: actions/setup-python@v5

        with:
          python-version: "3.12"


      - name: Install dependencies
        run: |
          pip install -r requirements.txt


      - name: Update market data
        working-directory: updater
        run: |
          python update_market.py


      - name: Send weekly email
        working-directory: updater
        run: |
          python email_report.py

        env:

          SMTP_HOST:
            ${{ secrets.SMTP_HOST }}

          SMTP_PORT:
            ${{ secrets.SMTP_PORT }}

          SMTP_USER:
            ${{ secrets.SMTP_USER }}

          SMTP_PASSWORD:
            ${{ secrets.SMTP_PASSWORD }}

          EMAIL_TO:
            ${{ secrets.EMAIL_TO }}

          DASHBOARD_URL:
            ${{ secrets.DASHBOARD_URL }}